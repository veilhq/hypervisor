<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>PENDING</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
// Engine surface used by 2D modes
window.ssModes = {};
window.__ss = { usePalette: false };
window.ssUsePalette = function () { return window.__ss.usePalette; };
window.ssGetAccent = function () { return '#00ff41'; };
window.ssHexToRgb = function (h) {
  return { r: parseInt(h.slice(1,3),16), g: parseInt(h.slice(3,5),16), b: parseInt(h.slice(5,7),16) };
};
window.ssHexToRgba = function (hex, a) {
  return 'rgba(' + parseInt(hex.slice(1,3),16) + ',' + parseInt(hex.slice(3,5),16) + ',' + parseInt(hex.slice(5,7),16) + ',' + a + ')';
};
window.ssGetPalette = function () { return ['#00ff41','#ffb000','#00cccc','#ff3333']; };
window.ssCanvas = null;
window.ssCtx = null;
</script>
<script src="assets/js/screensaver/orbits.js"></script>
<script src="assets/js/screensaver/cubefold.js"></script>
<script>
(function () {
  // ?mode=orbits&frames=300&pal=0&cols=4&step=90  -> filmstrip of N poses
  var qp = new URLSearchParams(location.search);
  var key = qp.get('mode') || 'orbits';
  var cols = parseInt(qp.get('cols') || '4', 10);
  var stepFrames = parseInt(qp.get('step') || '90', 10);
  var pal = qp.get('pal') === '1';
  var TW = 380, TH = 300;

  var stage = document.getElementById('stage');
  stage.width = TW * cols;
  stage.height = TH;
  var sctx = stage.getContext('2d');
  sctx.fillStyle = '#000';
  sctx.fillRect(0, 0, stage.width, TH);

  // Offscreen tile that the mode draws into, proxied like the engine does
  var tile = document.createElement('canvas');
  tile.width = TW; tile.height = TH;
  var tctx = tile.getContext('2d');

  window.__ss.usePalette = pal;
  window.ssCanvas = { width: TW, height: TH };
  window.ssCtx = tctx;

  var m = window.ssModes[key];
  m.init();
  var drawn = 0;
  for (var c = 0; c < cols; c++) {
    // Advance to this column's pose
    while (drawn < (c + 1) * stepFrames) { m.draw(); drawn++; }
    sctx.drawImage(tile, c * TW, 0);
    sctx.strokeStyle = 'rgba(0,255,65,0.25)';
    sctx.strokeRect(c * TW + 0.5, 0.5, TW - 1, TH - 1);
    sctx.fillStyle = '#00ff41';
    sctx.font = '12px monospace';
    sctx.fillText('f' + drawn, c * TW + 8, TH - 8);
  }
  document.title = 'DONE';
})();
</script>
</body>
</html>
