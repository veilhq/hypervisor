<div class="utility-body">
    <h1><i data-lucide="monitor" class="utility-title-icon"></i> Screensaver</h1>
    <p class="utility-intro">Choose a screensaver mode. Press <kbd class="ss-kbd">s</kbd> anywhere to launch, or wait for the idle timer.</p>

    <div class="ss-top">
      <div class="ss-stage">
        <div class="ss-card-media ss-stage-media">
          <span class="ss-card-frame"><canvas class="ss-card-preview" id="ss-stage-preview"></canvas></span>
        </div>
        <div class="ss-stage-foot">
          <div class="ss-stage-info">
            <div class="ss-card-header" id="ss-stage-head"></div>
            <div class="ss-card-desc" id="ss-stage-desc"></div>
          </div>
          <button class="ss-launch action-button action-button-primary" id="ss-launch"><i data-lucide="play" class="ss-launch-icon"></i> Launch Now</button>
        </div>
      </div>

        <div class="ss-settings">
          <div class="ss-col">
          <div class="ss-group-label">General</div>
          <div class="ss-setting-row flex-between">
            <label for="ss-idle">Idle timeout</label>
            <select id="ss-idle" class="form-select">
              <option value="0">Disabled</option>
              <option value="60000">1 minute</option>
              <option value="120000">2 minutes</option>
              <option value="300000">5 minutes</option>
              <option value="600000">10 minutes</option>
              <option value="900000">15 minutes</option>
              <option value="1800000">30 minutes</option>
            </select>
          </div>
          <div class="ss-setting-row flex-between">
            <label for="ss-clock-face">Clock face</label>
            <select id="ss-clock-face" class="form-select"></select>
          </div>
          <div class="ss-setting-row flex-between">
            <label for="ss-palette-toggle">Use full palette</label>
            <input type="checkbox" id="ss-palette-toggle" class="form-check">
          </div>
          </div>
          <div class="ss-col">
          <div class="ss-group-label">Grid</div>
          <div class="ss-setting-row flex-between">
            <label for="ss-grid-mouse-toggle">Mouse interaction</label>
            <input type="checkbox" id="ss-grid-mouse-toggle" class="form-check" checked>
          </div>
          </div>
          <div class="ss-col">
          <div class="ss-group-label">GL Dither</div>
          <div class="ss-setting-row flex-between">
            <label for="ss-dither-pattern">Pattern</label>
            <select id="ss-dither-pattern" class="form-select">
              <option value="trig">Trig Waves</option>
              <option value="interference">Interference</option>
              <option value="plasma">Plasma</option>
              <option value="swirl">Swirl</option>
              <option value="lissajous">Lissajous</option>
              <option value="tunnel">Tunnel</option>
              <option value="kaleidoscope">Kaleidoscope</option>
              <option value="inkfold">Ink Fold</option>
              <option value="seamfold">Seam Fold</option>
              <option value="iris">Iris</option>
              <option value="fracture">Fracture</option>
              <option value="phasefold">Phase Fold</option>
              <option value="logzoom">Log Zoom</option>
            </select>
          </div>
          </div>
        </div>
    </div>

    <div class="ss-group-label">Modes</div>
    <div class="ss-cards" id="ss-cards"></div>
  </div>

<script>
(function () {
  // app.js loads after this inline script - wait for the screensaver API
  function boot() {
    var api = window.__screensaver;
    if (!api) return setTimeout(boot, 50);
    init(api);
  }

  function init(api) {
    // Build MODES dynamically from ssModes registry
    var MODES = Object.keys(window.ssModes).map(function (key) {
      var mode = window.ssModes[key];
      var meta = mode.meta || {};
      return {
        key: key,
        name: meta.name || key,
        icon: meta.icon || "monitor",
        desc: meta.desc || ""
      };
    });

    var currentMode = api.getMode();
    var cardsContainer = document.getElementById("ss-cards");
    var idleSelect = document.getElementById("ss-idle");
    var clockFaceSelect = document.getElementById("ss-clock-face");
    var paletteToggle = document.getElementById("ss-palette-toggle");
    var launchBtn = document.getElementById("ss-launch");

    // Render a static preview at the frame's real pixel size so the aspect
    // matches the box (no stretch); api.preview() reads canvas.width/height.
    function drawPreview(canvas, frame, key) {
      var rect = frame.getBoundingClientRect();
      var dpr = window.devicePixelRatio || 1;
      var pw = Math.max(1, Math.round(rect.width * dpr));
      var ph = Math.max(1, Math.round(rect.height * dpr));
      canvas.width = pw;
      canvas.height = ph;
      var ctx = canvas.getContext("2d");
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, pw, ph);
      try { api.preview(key, ctx, pw, ph); } catch (e) {}
    }

    // Stage: large preview + name/description of the selected mode.
    function renderStage() {
      var mode = MODES.filter(function (m) { return m.key === currentMode; })[0];
      if (!mode) return;
      var canvas = document.getElementById("ss-stage-preview");
      drawPreview(canvas, canvas.parentNode, mode.key);
      document.getElementById("ss-stage-head").innerHTML =
        '<i data-lucide="' + mode.icon + '" class="ss-card-icon"></i>' +
        '<span class="ss-card-name">' + mode.name + '</span>';
      document.getElementById("ss-stage-desc").textContent = mode.desc;
    }

    function refresh() {
      buildCards();
      renderStage();
      if (window.lucide) lucide.createIcons({ attrs: { "stroke-width": 1.5 } });
    }

    // Build mode cards with live preview canvases
    function buildCards() {
      cardsContainer.innerHTML = "";
      MODES.forEach(function (mode) {
        var card = document.createElement("div");
        card.className = "ss-card content-card" + (mode.key === currentMode ? " selected content-card-active" : "");
        card.setAttribute("data-mode", mode.key);
        card.setAttribute("role", "button");
        card.setAttribute("tabindex", "0");
        card.setAttribute("aria-label", "Select " + mode.name + " screensaver");

        card.title = mode.desc;

        var media = document.createElement("span");
        media.className = "ss-card-media";
        var frame = document.createElement("span");
        frame.className = "ss-card-frame";
        var preview = document.createElement("canvas");
        preview.className = "ss-card-preview";
        frame.appendChild(preview);
        media.appendChild(frame);
        card.appendChild(media);

        var body = document.createElement("div");
        body.className = "ss-card-body";

        var header = document.createElement("div");
        header.className = "ss-card-header";
        header.innerHTML = '<i data-lucide="' + mode.icon + '" class="ss-card-icon"></i>' +
                           '<span class="ss-card-name">' + mode.name + '</span>';
        body.appendChild(header);

        card.appendChild(body);
        cardsContainer.appendChild(card);
        drawPreview(preview, frame, mode.key);

        // Selection handler
        function selectMode() {
          currentMode = mode.key;
          api.setMode(mode.key);
          refresh();
        }
        card.addEventListener("click", selectMode);
        card.addEventListener("keydown", function (e) {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            selectMode();
          }
        });
      });
    }

    refresh();

    // Idle timeout
    idleSelect.value = String(api.getIdleTimeout());
    idleSelect.addEventListener("change", function () {
      api.setIdleTimeout(parseInt(this.value, 10));
    });

    // Clock face select - None first, then one option per registered face.
    (function buildClockFaces() {
      var faces = window.ssClockFaces || {};
      var current = api.getClockFace ? api.getClockFace() : "digital-24";
      clockFaceSelect.innerHTML = "";
      var noneOpt = document.createElement("option");
      noneOpt.value = "none";
      noneOpt.textContent = "None";
      clockFaceSelect.appendChild(noneOpt);
      Object.keys(faces).forEach(function (key) {
        var meta = faces[key].meta || {};
        var opt = document.createElement("option");
        opt.value = key;
        opt.textContent = meta.name || key;
        clockFaceSelect.appendChild(opt);
      });
      clockFaceSelect.value = current;
    })();
    clockFaceSelect.addEventListener("change", function () {
      if (api.setClockFace) api.setClockFace(this.value);
    });

    // Palette toggle
    paletteToggle.checked = api.getUsePalette();
    paletteToggle.addEventListener("change", function () {
      api.setUsePalette(this.checked);
      // Rebuild previews to reflect palette change
      refresh();
    });

    // Grid mouse toggle
    var gridMouseToggle = document.getElementById("ss-grid-mouse-toggle");
    function initGridMouse() {
      if (window.__gridMouse) {
        gridMouseToggle.checked = window.__gridMouse.get();
        gridMouseToggle.addEventListener("change", function () {
          window.__gridMouse.set(this.checked);
        });
      } else {
        setTimeout(initGridMouse, 100);
      }
    }
    initGridMouse();

    // Dither pattern selector
    var ditherPatternSelect = document.getElementById("ss-dither-pattern");
    ditherPatternSelect.value = api.getDitherPattern ? api.getDitherPattern() : "trig";
    ditherPatternSelect.addEventListener("change", function () {
      if (api.setDitherPattern) api.setDitherPattern(this.value);
    });

    // Launch button
    launchBtn.addEventListener("click", function () {
      api.activate(currentMode);
    });

    // Init lucide icons in cards
    if (window.lucide) {
      setTimeout(function () {
        lucide.createIcons({ attrs: { "stroke-width": 1.5 } });
      }, 50);
    }
  }

  boot();
})();
</script>
